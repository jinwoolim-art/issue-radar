# 출처 목록 — 코드 수정 없이 여기서 켜고 끄고 추가합니다.
# tier: A=무료 공개 / B=계정·키 필요(무료) / C=유료
# base: 출처 자체의 신뢰·중요도 가중치 (반응 수치가 없는 출처는 이 값이 기본 점수)

channel: ai

# 콘텐츠 라인별 브리프 상태
#   daily : 기본으로 매일 — "이거 좋은 정보네" 하고 저장·하트 누를 만한 것
#   series: 시리즈로 이어가는 라인
#   hold  : 수집은 계속, 브리프는 보류 후보군
brief_lines:
  AI 소식: daily
  사용 스킬: daily
  요금·프로모션: daily
  AI 검색 노출(GEO): series
  AI 광고 상품: hold
  AI 기업 홍보: hold

sources:
  - id: openai_blog
    name: OpenAI 공식
    type: rss
    tier: A
    url: https://openai.com/news/rss.xml
    base: 30
    official: true

  - id: google_ai_blog
    name: Google AI 공식
    type: rss
    tier: A
    url: https://blog.google/technology/ai/rss/
    base: 25
    official: true

  - id: anthropic_news
    name: Anthropic 공식
    type: anthropic_news
    tier: A
    url: https://www.anthropic.com/news
    base: 30
    official: true

  - id: hackernews
    name: Hacker News
    type: hackernews
    tier: A
    min_points: 40
    base: 10
    ai_filter: true

  - id: geeknews
    name: GeekNews
    type: rss
    tier: A
    url: https://news.hada.io/rss/news
    base: 12
    ai_filter: true

  - id: aitimes
    name: AI타임스
    type: rss
    tier: A
    url: https://www.aitimes.com/rss/allArticle.xml
    base: 10

  - id: github_trending
    name: GitHub 트렌딩
    type: github_trending
    tier: A
    url: https://github.com/trending?since=daily
    base: 8
    ai_filter: true

  # ── 콘텐츠 라인 키워드 감시 (구글 뉴스 검색 피드, 무료) ──
  # line: 이 키워드로 들어온 글은 해당 코너로 바로 분류
  - id: gnews_watch
    name: 구글뉴스 키워드
    type: gnews
    tier: A
    days: 3
    per_query: 15
    base: 12
    # 돈 내고 올리는 보도자료 배포처 — 업체 홍보문이라 제외
    block_publishers: [EIN News, Business Wire, BusinessWire, PR Newswire, GlobeNewswire, FinancialContent,
                       StreetInsider, Accesswire, Newsfile, openPR, 뉴스와이어]
    queries:
      - {q: "챗GPT 광고", lang: ko, line: AI 광고 상품}
      - {q: '"ChatGPT ads" OR "ChatGPT advertising"', lang: en, line: AI 광고 상품}
      - {q: '"생성형 검색 최적화" OR "GEO 마케팅" OR "AI 검색 최적화"', lang: ko, line: AI 검색 노출(GEO), days: 7, decay_hours: 168}
      - {q: '"챗GPT에" 물었더니 브랜드 OR "AI 검색" 노출 브랜드 OR "AI 브리핑" 노출', lang: ko, line: AI 검색 노출(GEO), days: 7, decay_hours: 168}
      - {q: '"generative engine optimization" OR "AI search visibility"', lang: en, line: AI 검색 노출(GEO), days: 7, decay_hours: 168}

  # ── 광고·마케팅 업계 매체 (AI 관련 기사만) ──
  - id: digiday
    name: Digiday
    type: rss
    tier: A
    url: https://digiday.com/feed/
    base: 14
    ai_filter: true

  - id: adweek
    name: Adweek
    type: rss
    tier: A
    url: https://www.adweek.com/feed/
    base: 12
    ai_filter: true

  - id: marketingdive
    name: Marketing Dive
    type: rss
    tier: A
    url: https://www.marketingdive.com/feeds/news/
    base: 12
    ai_filter: true

  - id: madtimes
    name: 매드타임스
    type: rss
    tier: A
    url: https://www.madtimes.org/rss/allArticle.xml
    base: 10
    ai_filter: true

  - id: thepr
    name: 더피알
    type: rss
    tier: A
    url: https://www.the-pr.co.kr/rss/allArticle.xml
    base: 10
    ai_filter: true

  - id: brandbrief
    name: 브랜드브리프
    type: rss
    tier: A
    url: https://www.brandbrief.co.kr/rss/allArticle.xml
    base: 10
    ai_filter: true

  # ── 네이버 검색 (뉴스·블로그·카페글) — ⛔ 사용 중지 (2026-10-07) ──
  # 네이버가 2026-07-31부터 개발자센터 신규 신청 중단(→ 네이버클라우드 API 허브 이관),
  # 2026-09-07 약관 개정: 검색 API 데이터를 AI 입력·학습·노출, 수익화, 저장·캐싱에 쓰는 것 금지.
  # 우리 용도(AI 분류·브리프, 수익 채널, 저장)와 정면으로 충돌 → 쓰지 않는다. 국내 범위는 구글뉴스 KR + 국내 매체 RSS로.
  - id: naver
    name: 네이버
    type: naver
    tier: B
    enabled: false
    kinds: [news, blog, cafearticle]
    per_query: 20
    base: 12
    ai_filter: true
    queries:
      - {q: "챗GPT 신기능"}
      - {q: "제미나이 요금"}
      - {q: "클로드 사용법"}
      - {q: "챗GPT 광고", line: AI 광고 상품}
      - {q: "AI 브리핑 플레이스", line: AI 검색 노출(GEO), decay_hours: 168}
      - {q: "챗GPT 가게 추천", line: AI 검색 노출(GEO), decay_hours: 168}

  - id: reddit
    name: Reddit
    type: reddit
    tier: B
    subreddits: [ChatGPT, ClaudeAI, OpenAI, LocalLLaMA, singularity, GeminiAI, StableDiffusion, artificial]
    limit: 25
    base: 10

  - id: youtube
    name: YouTube
    type: youtube
    tier: B
    regions: [KR, US]
    category_id: "28"   # 과학기술
    ai_filter_title_only: true   # 영상 설명란은 해시태그 도배가 많아 제목만 본다
    queries:                      # 검색 1회 = 100유닛
      - {q: "AI 신기능", region: KR, lang: ko}
      - {q: "챗GPT 클로드 제미나이", region: KR, lang: ko}
      - {q: "new AI tool", region: US, lang: en}
    search_every_hours: 3   # 검색 1회=100유닛 → 3시간마다만 (하루 약 2,400유닛)
    base: 10
    ai_filter: true

# 요금·프로모션 페이지 변경 감시 (트랙 2)
pricing_pages:
  - id: claude
    name: Claude 요금
    url: https://claude.com/pricing
  - id: gemini
    name: Gemini 요금
    url: https://gemini.google/subscriptions/
  - id: chatgpt
    name: ChatGPT 요금
    url: https://openai.com/chatgpt/pricing/
    # 보안 차단 페이지 — http.get 이 위장 접속으로 자동 재시도
