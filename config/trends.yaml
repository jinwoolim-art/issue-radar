# 트렌드 계기판 키워드 — "탐님 관심(공급)" vs "시청자 반응(수요)" 비교용
# star: 탐님 관심도 3=핵심 2=관심 1=지켜보기
# aliases: 수집된 기사·영상 제목에서 이 키워드를 알아보는 표기 (소문자 비교)
